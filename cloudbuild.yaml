substitutions:
  _REGION: asia-south1
  _REPOSITORY: medio
  _BACKEND_IMAGE: medio-backend
  _FRONTEND_IMAGE: medio-frontend
  _OTP_JAR_GCS_URI: gs://medio-500217-otp-artifacts/otp/otp.jar
  _OTP_JAR_SHA256: eb4224cb0f59ed913ee240d17838091a0e6da2d81d8216c31c07c51502831697
  _VITE_BACKEND_URL: https://medio-api-REPLACE_ME.a.run.app
  _VITE_FRONTEND_URL: https://medio.mywire.org

steps:
  - id: Build backend image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_BACKEND_IMAGE}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_BACKEND_IMAGE}:latest
      - ./backend

  - id: Build frontend image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VITE_BACKEND_URL=${_VITE_BACKEND_URL}
      - --build-arg
      - VITE_FRONTEND_URL=${_VITE_FRONTEND_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_FRONTEND_IMAGE}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_FRONTEND_IMAGE}:latest
      - ./frontend

  - id: Fetch OTP jar
    name: gcr.io/cloud-builders/gsutil
    args:
      - cp
      - ${_OTP_JAR_GCS_URI}
      - otp-project/otp.jar

  - id: Verify OTP jar
    name: eclipse-temurin:21-jre
    entrypoint: bash
    args:
      - -ceu
      - |
        echo "${_OTP_JAR_SHA256}  otp-project/otp.jar" | sha256sum -c -
        test "$(stat -c%s otp-project/otp.jar)" -gt 100000000
        java -jar otp-project/otp.jar --version

  - id: Build OTP image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/medio-500217/medio/medio-otp:${SHORT_SHA}
      - -t
      - asia-south1-docker.pkg.dev/medio-500217/medio/medio-otp:latest
      - ./otp-project

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_BACKEND_IMAGE}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_BACKEND_IMAGE}:latest
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_FRONTEND_IMAGE}:${SHORT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_FRONTEND_IMAGE}:latest
  - asia-south1-docker.pkg.dev/medio-500217/medio/medio-otp:${SHORT_SHA}
  - asia-south1-docker.pkg.dev/medio-500217/medio/medio-otp:latest

options:
  logging: CLOUD_LOGGING_ONLY
