services:
  - type: pserv
    name: medio-otp
    runtime: docker
    dockerfilePath: otp-project/Dockerfile
    dockerContext: otp-project
    envVars:
      - key: PORT
        value: 8080
      - key: JAVA_OPTS
        value: -Xmx350m

  - type: web
    name: medio-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://app.medio.is
      - key: ALLOWED_ORIGINS
        value: https://app.medio.is,https://frontend.vercel.app
      - key: CAPACITOR_ORIGINS
        value: capacitor://localhost,http://localhost,https://localhost
      - key: OTP_HOSTPORT
        fromService:
          name: medio-otp
          type: pserv
          property: hostport
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: medio-api
      - key: JWT_AUDIENCE
        value: medio-web
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: BCRYPT_ROUNDS
        value: 12
      - key: LOG_LEVEL
        value: info
